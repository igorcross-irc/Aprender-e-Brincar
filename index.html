<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Aplicativo educativo para crianças de 2 a 5 anos" />
  <title>Aprender e Brincar</title>
  
  <link rel="icon" type="image/png" href="/assets/images/icon-master.png" />
  <link rel="manifest" href="/manifest.json" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/src/css/styles.css" />
</head>
<body class="bg-sky-100 text-slate-800 font-sans select-none overflow-hidden h-screen h-dvh flex flex-col">
  
  <header class="bg-white/90 backdrop-blur-md shadow-sm px-4 py-3 flex justify-between items-center z-20 border-b-2 border-indigo-100">
    <div class="flex items-center gap-2">
      <button id="btn-home-logo" class="flex items-center gap-2 text-left focus:outline-none" aria-label="Página Inicial">
        <img src="/assets/images/icon-home.png" class="w-9 h-9 object-contain" alt="Home" />
      </button>
      <h1 class="text-lg font-bold text-indigo-600 tracking-wide">Aprender & Brincar</h1>
    </div>
    
    <div class="flex items-center gap-3">
      <button id="btn-mute" class="bg-slate-100 p-2 rounded-full text-xl shadow-sm" aria-label="Alternar som">🔊</button>
      <div id="score-board" class="flex items-center gap-1.5 bg-amber-100 px-3 py-1 rounded-full text-amber-800 font-bold text-sm border border-amber-300">
        ⭐ <span id="star-count">0</span>
      </div>
      <button id="btn-settings" class="bg-slate-100 p-2 rounded-full shadow-sm" aria-label="Configurações dos pais">
        <img src="/assets/images/icon-settings.png" class="w-7 h-7 object-contain" alt="Configurações" />
      </button>
    </div>
  </header>

  <main id="game-container" class="flex-1 overflow-y-auto p-4 flex flex-col items-center justify-center">
    <!-- Conteúdo injetado pelo app.js -->
  </main>

  <script type="module" src="/src/js/app.js"></script>
</body>
</html>
