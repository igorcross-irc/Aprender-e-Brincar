<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Aprender e Brincar</title>
  <link rel="icon" type="image/png" href="/assets/images/icon-master.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/src/css/styles.css" />
</head>
<body class="bg-sky-100 text-slate-800 font-sans select-none overflow-hidden">
  
  <div id="app" class="h-screen w-screen flex flex-col justify-between">
    <!-- Header Fixo -->
    <header class="p-3 bg-white/80 backdrop-blur-md shadow-sm flex justify-between items-center z-10">
      <h1 class="text-lg font-bold text-indigo-600 flex items-center gap-2">
        <img src="/assets/images/icon-home.png" class="w-7 h-7 inline-block" alt="Home" />
        <span>Aprender & Brincar</span>
        <span class="text-xs bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full font-normal">v0.2</span>
      </h1>
      
      <div class="flex items-center gap-3">
        <div id="score-board" class="flex items-center gap-1.5 bg-amber-100 px-3 py-1 rounded-full text-amber-800 font-bold text-sm border border-amber-200">
          ⭐ <span id="star-count">0</span>
        </div>
        <button id="btn-settings" class="p-1 rounded-full hover:bg-slate-100 transition shadow-sm" title="Área dos Pais">
          <img src="/assets/images/icon-settings.png" class="w-8 h-8" alt="Configurações" />
        </button>
      </div>
    </header>

    <!-- Área Principal de Jogos -->
    <main id="game-container" class="flex-1 overflow-y-auto p-4 flex flex-col items-center justify-center">
      <!-- Conteúdo injetado via JS -->
    </main>

    <!-- Rodapé -->
    <footer class="p-1.5 text-center text-[10px] text-slate-400 bg-white/40">
      Aprender & Brincar v0.2.0 • Edição Modular Vercel
    </footer>
  </div>

  <script type="module" src="/src/js/app.js"></script>
</body>
</html>
