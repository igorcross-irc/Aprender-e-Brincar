<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Aprender e Brincar</title>
  <link rel="icon" type="image/png" href="/assets/images/icon-master.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/src/css/styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700;800&display=swap" rel="stylesheet">
</head>
<body>
  
  <div id="app">
    <!-- Header Fixo -->
    <header>
      <div class="brand">
        <img src="/assets/images/icon-home.png" class="brand-icon" alt="Home" />
        <span class="brand-title">Aprender & Brincar</span>
        <span class="version-badge">v0.2</span>
      </div>
      
      <div class="header-actions">
        <div id="score-board" class="score-board">
          ⭐ <span id="star-count">0</span>
        </div>
        <button id="btn-settings" class="btn-icon" title="Área dos Pais">
          <img src="/assets/images/icon-settings.png" alt="Configurações" />
        </button>
      </div>
    </header>

    <!-- Área Principal de Jogos -->
    <main id="game-container">
      <!-- Conteúdo injetado via JS -->
    </main>

    <!-- Rodapé -->
    <footer>
      Aprender & Brincar v0.2.0 • Edição Modular Vercel
    </footer>
  </div>

  <script type="module" src="/src/js/app.js"></script>
</body>
</html>
