<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0284c7" />
  <meta name="description" content="Aprender & Brincar: um universo seguro de descobertas, brincadeiras e experiências educativas para crianças de 6 meses a 5 anos." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Aprender & Brincar — Mapa de Descobertas</title>
  <link rel="icon" type="image/png" href="/assets/images/icon-master.png" />
  <link rel="apple-touch-icon" href="/assets/images/icon-master.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/src/css/styles.css" />
</head>
<body class="bg-sky-100 text-slate-800 font-sans select-none overflow-hidden h-screen h-dvh flex flex-col">
  <header class="bg-white/90 backdrop-blur-md shadow-sm px-4 py-3 flex justify-between items-center z-20 border-b-2 border-indigo-100 safe-area-top">
    <div class="flex items-center gap-2">
      <button id="btn-home-logo" class="touch-target flex items-center gap-2 text-left focus:outline-none focus-visible:ring-4 focus-visible:ring-indigo-300 rounded-xl" aria-label="Página Inicial">
        <img src="/assets/images/icon-home.png" class="w-9 h-9 object-contain" alt="Início" />
      </button>
      <h1 class="text-lg font-bold text-indigo-600 tracking-wide">Aprender & Brincar</h1>
    </div>
    <div class="flex items-center gap-3">
      <button id="btn-mute" class="touch-target bg-slate-100 p-2 rounded-full text-xl shadow-sm focus-visible:ring-4 focus-visible:ring-indigo-300" aria-label="Alternar som">🔊</button>
      <div id="score-board" class="flex items-center gap-1.5 bg-amber-100 px-3 py-1 rounded-full text-amber-800 font-bold text-sm border border-amber-300" aria-live="polite">
        ⭐ <span id="star-count">0</span>
      </div>
      <button id="btn-settings" class="touch-target bg-slate-100 p-2 rounded-full shadow-sm focus-visible:ring-4 focus-visible:ring-indigo-300" aria-label="Configurações dos pais">
        <img src="/assets/images/icon-settings.png" class="w-7 h-7 object-contain" alt="Configurações" />
      </button>
    </div>
  </header>
  <main id="game-container" class="flex-1 min-h-0 overflow-y-auto overscroll-y-contain p-4 flex flex-col items-center justify-start" tabindex="-1"></main>
  <script type="module" src="/src/js/app.js"></script>
</body>
</html>
