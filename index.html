<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#7c3aed" />
  <meta name="description" content="Aprender & Brincar: brincadeiras educativas, seguras e sem anúncios para crianças de 6 meses a 5 anos." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Aprender & Brincar</title>
  <link rel="icon" type="image/png" href="/assets/images/icon-master.png" />
  <link rel="apple-touch-icon" href="/assets/images/icon-master.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/src/css/styles.css" />
</head>
<body class="app-body select-none overflow-hidden h-screen h-dvh flex flex-col">
  <header class="app-header safe-area-top">
    <button id="btn-home-logo" class="header-button" aria-label="Início">
      <img src="/assets/images/icon-home.png" alt="" />
    </button>
    <div id="score-board" class="score-pill" aria-live="polite" aria-label="Estrelas">
      <span aria-hidden="true">⭐</span> <span id="star-count">0</span>
    </div>
    <div class="header-actions">
      <span id="pwa-status" class="sr-only" aria-live="polite"></span>
      <button id="btn-replay" class="header-button" aria-label="Ouvir de novo">🔊</button>
      <button id="btn-settings" class="header-button header-button-quiet" aria-label="Área da família (para adultos)">
        <img src="/assets/images/icon-settings.png" alt="" />
      </button>
    </div>
  </header>
  <main id="game-container" class="flex-1 min-h-0 overflow-y-auto overscroll-y-contain p-4 flex flex-col items-center justify-start" tabindex="-1"></main>
  <script type="module" src="/src/js/app.js"></script>
</body>
</html>
