<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Aprender e Brincar</title>
  
  <!-- Ícones e Manifesto PWA -->
  <link rel="icon" type="image/png" href="/assets/images/icon-master.png" />
  <link rel="manifest" href="/manifest.json" />
  
  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9073017081831154" crossorigin="anonymous"></script>
  
  <!-- Fonte Lúdica (Fredoka) -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Fredoka', 'sans-serif'] }
        }
      }
    }
  </script>

  <!-- CSS Customizado -->
  <link rel="stylesheet" href="/src/css/styles.css" />
</head>
<body class="bg-sky-50 text-slate-800 font-sans select-none overflow-hidden h-screen w-screen flex flex-col">
  
  <header class="bg-white/90 backdrop-blur-md shadow-sm px-4 py-3 flex justify-between items-center z-20 border-b-4 border-indigo-100">
    <div class="flex items-center gap-3">
      <img src="/assets/images/icon-home.png" class="w-10 h-10 object-contain drop-shadow-sm" alt="Home" />
      <h1 class="text-xl font-bold text-indigo-600 tracking-wide hidden sm:block">Aprender & Brincar</h1>
      <span class="text-xs bg-indigo-100 text-indigo-700 px-2.5 py-1 rounded-full font-bold ml-2">v0.2</span>
    </div>
    
    <div class="flex items-center gap-4">
      <div id="score-board" class="flex items-center gap-2 bg-amber-100 px-4 py-1.5 rounded-full text-amber-700 font-bold border-2 border-amber-200 shadow-sm">
        <span class="text-lg">⭐</span> <span id="star-count" class="text-lg">0</span>
      </div>
      <button id="btn-settings" class="hover:scale-105 active:scale-95 transition-transform bg-slate-100 p-2 rounded-full shadow-sm" title="Área dos Pais">
        <img src="/assets/images/icon-settings.png" class="w-8 h-8 object-contain" alt="Config" />
      </button>
    </div>
  </header>

  <main id="game-container" class="flex-1 overflow-y-auto p-4 md:p-8 flex flex-col items-center justify-center relative bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] bg-opacity-10">
    <!-- Conteúdo injetado via JS -->
  </main>

  <footer class="bg-white/80 p-2 text-center text-xs text-slate-400 font-medium z-10 border-t border-slate-100">
    Aprender & Brincar v0.2.0 • Sistema Restaurado
  </footer>

  <script type="module" src="/src/js/app.js"></script>
</body>
</html>
