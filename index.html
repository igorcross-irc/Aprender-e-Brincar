<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Aprender e Brincar</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/src/css/styles.css" />
</head>
<body class="bg-sky-100 text-slate-800 font-sans select-none overflow-hidden">
  
  <div id="app" class="h-screen w-screen flex flex-col justify-between">
    <!-- Header Fixo -->
    <header class="p-4 bg-white/80 backdrop-blur-md shadow-md flex justify-between items-center z-10">
      <h1 class="text-xl font-bold text-indigo-600">Aprender & Brincar 🍦</h1>
      <div id="score-board" class="flex items-center gap-2 bg-amber-100 px-3 py-1 rounded-full text-amber-700 font-bold">
        ⭐ <span id="star-count">0</span>
      </div>
    </header>

    <!-- Área Principal de Jogos -->
    <main id="game-container" class="flex-1 overflow-y-auto p-4 flex flex-col items-center justify-center">
      <!-- Módulos injetados via JS -->
    </main>

    <!-- Rodapé -->
    <footer class="p-2 text-center text-xs text-slate-400">
      v0.2.0 - Edição Modular Vercel
    </footer>
  </div>

  <script type="module" src="/src/js/app.js"></script>
</body>
</html>
