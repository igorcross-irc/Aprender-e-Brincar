name: Release

# Publica uma versão nova: site (zip para o app Android se atualizar sozinho),
# APK assinado e update.json. Dois jeitos de disparar:
#   - Actions → Release → "Run workflow" (usa a versão do package.json na branch escolhida;
#     o release cria a tag v<versão> sozinho), ou
#   - git tag v0.6.0 && git push origin v0.6.0 (a tag tem de ser igual ao package.json).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Versão confere com a tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME diferente do package.json ($VERSION)"; exit 1; }
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build do site
        run: npm run build
      - name: Pacote do conteúdo
        run: |
          (cd dist && zip -qr "../web-$VERSION.zip" .)
          echo "WEB_SHA=$(sha256sum web-$VERSION.zip | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "FINGERPRINT=$(node -p "require('./dist/native.json').fingerprint")" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK
        # O computador do GitHub já traz o SDK; só garante licenças e a versão de compilação.
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Chave de assinatura
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Sem o segredo ANDROID_KEYSTORE_BASE64: release sai sem APK (só conteúdo)."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: APK
        if: steps.keystore.outputs.present == 'true'
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npx cap sync android
          (cd android && ./gradlew assembleRelease --no-daemon)
          cp android/app/build/outputs/apk/release/app-release.apk aprender-e-brincar.apk
      - name: update.json
        env:
          HAS_APK: ${{ steps.keystore.outputs.present }}
        run: |
          node -e '
            const [major, minor, patch] = process.env.VERSION.split(".").map(Number);
            const info = {
              version: process.env.VERSION,
              fingerprint: process.env.FINGERPRINT,
              web: { file: `web-${process.env.VERSION}.zip`, sha256: process.env.WEB_SHA },
              android: process.env.HAS_APK === "true" ? { file: "aprender-e-brincar.apk", versionCode: major * 10000 + minor * 100 + patch } : null
            };
            require("fs").writeFileSync("update.json", JSON.stringify(info, null, 2));
            console.log(info);
          '
      - name: Guardar arquivos (teste fora da main)
        if: github.ref != 'refs/heads/main' && github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.VERSION }}
          path: |
            update.json
            web-${{ env.VERSION }}.zip
            aprender-e-brincar.apk
          if-no-files-found: warn
      - name: Publicar release
        if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Aprender & Brincar ${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            update.json
            web-${{ env.VERSION }}.zip
            aprender-e-brincar.apk
          fail_on_unmatched_files: false
