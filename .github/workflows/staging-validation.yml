name: Staging Validation

on:
  push:
    branches:
      - 'staging/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Core tests
        run: npm run test:core
      - name: Smoke test
        run: npm run smoke
      - name: Game audit
        run: npm run audit:games
      - name: Child interface audit
        run: npm run audit:child-interface
      - name: Audio audit
        run: npm run audit:audio
      - name: Build
        run: npm run build
