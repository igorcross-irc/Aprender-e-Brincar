name: Build & Test

on:
  push:
    branches: [main, 'foundation/**', 'staging/**', 'claude/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Core tests
        run: npm run test:core
      - name: Smoke test
        run: npm run smoke
      - name: Game audit
        run: npm run audit:games
      - name: Child interface audit
        run: npm run audit:child-interface
      - name: Audio audit
        run: npm run audit:audio
      - name: Histórias (catálogo, ilustrações e narração)
        run: npm run audit:stories
      - name: Build
        run: npm run build
      - name: Orçamento de tamanho
        run: node scripts/budget-check.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end
        run: node scripts/e2e-test.mjs
      - name: Aparelhos antigos (iOS 9, Android 5)
        run: node scripts/legacy-audit.mjs

  # Os testes de cada jogo rodam em paralelo (cada um gera o próprio build).
  games:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Fazendinha, Cenas e Estúdio
            scripts: farm-test scene-test studio-test
          - name: Ateliê, Cozinha e Torre de Blocos
            scripts: atelie-test cozinha-test blocos-test
          - name: Início, Parlendas e Sentimentos
            scripts: familia-test parlendas-test sentimentos-test
    name: ${{ matrix.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Testes (${{ matrix.name }})
        run: |
          for t in ${{ matrix.scripts }}; do
            echo "::group::$t"
            node scripts/$t.mjs
            echo "::endgroup::"
          done
