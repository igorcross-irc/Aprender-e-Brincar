name: Build & Test

on:
  push:
    branches: [main, 'foundation/**', 'staging/**', 'claude/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Core tests
        run: npm run test:core
      - name: Smoke test
        run: npm run smoke
      - name: Game audit
        run: npm run audit:games
      - name: Child interface audit
        run: npm run audit:child-interface
      - name: Audio audit
        run: npm run audit:audio
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end
        run: node scripts/e2e-test.mjs
      - name: Aparelhos antigos (iOS 9, Android 5)
        run: node scripts/legacy-audit.mjs
      - name: Fazendinha (WebGL e modo lite)
        run: node scripts/farm-test.mjs
