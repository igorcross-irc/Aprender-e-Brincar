name: Build & Smoke Test

on:
  push:
    branches: [main, 'foundation/**', 'staging/**']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      - name: Game audit
        run: npm run audit:games
      - name: Smoke test
        run: npm run smoke
      - name: Core tests
        run: npm run test:core
      - name: Child interface audit
        run: npm run audit:child-interface
      - name: Audio audit
        run: npm run audit:audio
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium
      - name: Browser audit
        run: npm run test:browser
